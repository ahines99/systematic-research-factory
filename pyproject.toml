[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "systematic-research-factory"
version = "0.1.0"
description = "Governed, point-in-time-clean systematic research with an LLM only at judgment steps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alex Hines" }]
dependencies = [
  "mcp[cli]>=2,<3",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "numpy>=2.0",
  "httpx>=0.27",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.12",
  "types-PyYAML>=6.0",
  "matplotlib>=3.11.2",
]

[project.scripts]
rsf = "research_factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_factory"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "research_factory/_skills"
"evals/golden" = "research_factory/_evals/golden"

[tool.hatch.build.targets.sdist]
include = [
  "src/research_factory", "tests", "skills", "docs", "evals", "examples", "scripts",
  "README.md", "LICENSE", "IMPLEMENTATION_HANDOFF.md", "CHANGELOG.md",
  "Dockerfile", ".dockerignore", "docker-compose.yml", "fly.toml", "Makefile",
  ".gitignore", ".env.example", ".github", ".gitattributes", "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "postgres: requires DATABASE_URL pointing at PostgreSQL",
  "network: performs live network calls (skipped by default)",
  "live_model: calls a real model API (skipped unless ANTHROPIC_API_KEY is set)",
]
filterwarnings = ["error::DeprecationWarning:research_factory.*"]

[tool.coverage.run]
source = ["research_factory"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "DTZ"]
ignore = [
  "S101",   # assert is fine in tests and invariants
  "RUF001", "RUF002", "RUF003",  # allow typographic characters in docs/strings
  "E501",   # the formatter owns line length; long literals are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "PT018"]
"skills/**" = ["S", "T201"]
"src/research_factory/server/**" = ["B008"]  # MCP tool parameters declare constraints with Field()

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["research_factory"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml.*", "boto3.*", "botocore.*", "opentelemetry.*", "psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["research_factory.http_app"]
disallow_untyped_decorators = false  # MCPServer.custom_route is untyped
