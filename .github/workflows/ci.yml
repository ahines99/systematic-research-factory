name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  postgres:
    name: repository contract suite on PostgreSQL (RSF-060)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rsf-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:rsf-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv run pytest tests/test_persistence.py tests/test_postgres.py -v

  evals:
    name: golden evaluation suite (RSF-032)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - run: uv sync --locked --python 3.12
      - run: uv run rsf eval --provider rules --out var/scorecard.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: scorecard
          path: var/scorecard.*

  supply-chain:
    name: dependency audit (RSF-075)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - run: uv export --locked --all-extras --no-dev --format requirements-txt --no-hashes --no-emit-project > requirements.txt
      - run: uvx pip-audit@2.10.1 --disable-pip --no-deps --strict -r requirements.txt
