name: release

# Build once, scan, publish, copy the identical digest to Fly's authenticated registry, deploy.
# The production environment needs FLY_API_TOKEN and a read-only RSF_SMOKE_API_KEY.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_PYTHON: "3.14"

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  verify-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: tag, source versions and lock agree
        run: |
          python3 scripts/check_release.py "$GITHUB_REF_NAME"
          uv lock --check

  image:
    needs: [checks, verify-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.image }}
      - name: scan before publishing
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.119.0
          image: ${{ steps.meta.outputs.image }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: release-scan.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "${IMAGE%:*}" "$digest" > image-digest.txt
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: assemble release distributions and evidence
        run: |
          uv sync --locked --all-extras --python 3.14
          uv build --out-dir var/distributions
          uv run --no-sync rsf eval --provider rules --out var/evidence-scorecard.json
          uv run --no-sync rsf --provider rules demo --out-dir var/evidence-reports --manifest var/evidence-reports/manifest.json
          uv run --no-sync python scripts/package_evidence.py --source-revision "$GITHUB_SHA" --out var/release-evidence --distributions var/distributions --scorecard var/evidence-scorecard.json --reports var/evidence-reports
          cp var/release-evidence.zip release-evidence.zip
          sha256sum sbom.cdx.json release-scan.json image-digest.txt release-evidence.zip > SHA256SUMS
          (cd var/distributions && sha256sum *) >> SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            sbom.cdx.json
            release-scan.json
            image-digest.txt
            SHA256SUMS
            var/distributions/*.whl
            var/distributions/*.tar.gz
            release-evidence.zip
          generate_release_notes: true

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - run: uv sync --locked --python 3.14
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: copy and deploy the scanned digest (no rebuild)
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          app=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['app'])")
          source="${IMAGE%:*}@${DIGEST}"
          target="registry.fly.io/${app}:${GITHUB_REF_NAME}"
          docker pull "$source"
          flyctl auth docker
          docker tag "$source" "$target"
          docker push "$target"
          copied=$(docker inspect "$target" --format '{{json .RepoDigests}}' | python3 -c 'import json,sys; print(next(x.split("@",1)[1] for x in json.load(sys.stdin) if x.startswith("registry.fly.io/")))')
          test "$copied" = "$DIGEST"
          flyctl deploy --image "registry.fly.io/${app}@${DIGEST}" --ha=false --strategy rolling
      - name: seed free demo and verify readiness and client access
        env:
          RSF_SMOKE_API_KEY: ${{ secrets.RSF_SMOKE_API_KEY }}
        run: |
          app=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['app'])")
          curl --fail --retry 10 --retry-delay 6 --retry-all-errors "https://${app}.fly.dev/healthz"
          flyctl ssh console -C "rsf --provider rules demo"
          uv run --no-sync python scripts/smoke_deployment.py "https://${app}.fly.dev" --version "${GITHUB_REF_NAME#v}" --require-key
      - name: verify released pages in desktop and mobile browsers
        run: |
          app=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['app'])")
          npm install --prefix /tmp/rsf-browser --no-save playwright@1.63.0
          /tmp/rsf-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/rsf-browser/node_modules node scripts/browser_smoke.cjs "https://${app}.fly.dev" var/release-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: released-browser-evidence
          path: var/release-browser/
